# Nginx configuration for MultiPanel ERP production deployment

server {
    listen 80;
    listen [::]:80;
    server_name multipanel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name multipanel.example.com;

    root /var/www/multipanel/public;
    index index.php;

    # SSL — replace with your certificate paths (Let's Encrypt recommended)
    ssl_certificate     /etc/letsencrypt/live/multipanel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multipanel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/multipanel-access.log;
    error_log  /var/log/nginx/multipanel-error.log;

    # Max upload for CSV imports
    client_max_body_size 64M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SSE stream — disable buffering
    location /stream/events {
        try_files $uri /index.php?$query_string;
        proxy_buffering off;
        fastcgi_buffering off;
        gzip off;
    }

    # WebSocket proxy to realtime server
    location /ws {
        proxy_pass http://websocket:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Prometheus metrics (internal only)
    location /metrics {
        try_files $uri /index.php?$query_string;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block access to sensitive paths
    location ~ /\.(env|git|ht) {
        deny all;
    }

    location ~ ^/(storage|database|config|cron|tests|vendor)/ {
        deny all;
    }

    # Static assets cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
