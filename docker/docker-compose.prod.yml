version: '3.8'

# Production Docker Compose for MultiPanel ERP

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ../storage:/var/www/html/storage
      - ../.env:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_ENABLED: "true"
    networks:
      - multipanel

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../public:/var/www/html/public:ro
      - ./nginx/multipanel.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - multipanel

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-multipanel}
      MYSQL_USER: ${DB_USERNAME:-multipanel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seeds/default.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multipanel

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - multipanel

  cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "while true; do php /var/www/html/cron/run.php all; sleep 300; done"
    depends_on:
      - app
      - db
    volumes:
      - ../storage:/var/www/html/storage
      - ../.env:/var/www/html/.env:ro
    networks:
      - multipanel

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ../public:/var/www/html/public
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: php /var/www/html/scripts/websocket-server.php 8081
    volumes:
      - ../storage:/var/www/html/storage
    networks:
      - multipanel

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - multipanel

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/multipanel-dashboard.json:/etc/grafana/provisioning/dashboards/multipanel.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - multipanel

networks:
  multipanel:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  certbot-etc:
  certbot-var:
  grafana_data:
